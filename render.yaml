databases:
  - name: cuestionario-pdul-db
    databaseName: pdul_db
    user: pdul_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  # Backend API (FastAPI)
  - type: web
    name: cuestionario-pdul-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cuestionario-pdul-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEFAULT_PDUL_SCHEMA_PATH
        value: shared/schemas/pdul_origen_destino.json

  # Frontend Web (Vue 3 / Vite Static Site)
  - type: web
    name: cuestionario-pdul-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cuestionario-pdul-backend
          property: url

